[package]
name = "dfarmy"
version = "1.0.0"
edition = "2021"
description = "DroneFlames Reborn: army actions core on Rust (river fording, formation steering)"
license = "MIT"

[lib]
name = "dfarmy"
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", default-features = false, features = ["api-4-7"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
